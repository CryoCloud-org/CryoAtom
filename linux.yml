name: CryoAtom2
channels:
  #  uncomment the four lines below if you are located in China
#  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge/
#  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/pytorch/
#  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main/
#  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/free/
  - conda-forge
dependencies:
  - python=3.9
  - numpy=1.21.5
  - tqdm
  - pip
  - pip:
      # CUDA 12.8 build: runs on NVIDIA drivers from 525 up and on Blackwell GPUs (sm_120). The wheels bring
      # their own CUDA libraries. 2.8.0 is the newest torch with Python 3.9 wheels.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0+cu128
      - torchvision==0.23.0+cu128
      - torchaudio==2.8.0+cu128
      - einops==0.6.0
      - scipy==1.7.3
      - biopython==1.81
      - matplotlib==3.5.3
      - mrcfile==1.4.3
      - pandas==1.3.5
      - fair-esm==2.0.0
      - pyhmmer==0.7.1
      - joblib==1.0.1
      - ptflops==0.6.6
      - scikit-learn==0.24.0
      - threadpoolctl==2.2.0
      - rna-fm==0.2.2
      - openpyxl


